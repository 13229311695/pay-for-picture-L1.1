<body>
<div class="workspace">
<aside class="editor">
<div class="eyebrow">UI REPLICA / 958 × 2048</div><h1>账单界面编辑器</h1><p class="intro">输入信息，右侧画面实时更新。所有修改仅保存在当前浏览器；下载 HTML 可保留当前内容。</p>
<div class="toolbar"><button class="primary" id="download">下载当前 HTML</button><button id="pure">只看手机界面</button><button id="reset">恢复原图内容</button></div>
<label class="field"><span>预览宽度 <output id="widthOutput">400 px</output></span><input id="previewWidth" type="range" min="280" max="958" value="400"></label>
<div id="mainFields"></div>
<details><summary>更多文字与设置</summary><div id="extraFields"></div><label class="field"><span>计入收支</span><input type="checkbox" id="incomeControl" checked> 开启</label><label class="field"><span>商户 Logo（可上传替换）</span><input type="file" id="logoUpload" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><button id="resetLogo" class="upload-label">恢复默认 Logo</button></details>
<p class="help">画布固定为原图 958 × 2048，以等比缩放显示。输入过长会超出原图的可用空间，建议保持相近字数。不同设备的系统字体可能存在轻微差异。此页面为本地 UI 演示。</p>
</aside>
<main class="preview-area"><div class="preview-bar"><span>实时预览</span><span>原图比例 · 958 × 2048</span></div><div class="viewport" id="viewport"><div class="phone" id="phone">
<div class="pos back" aria-hidden="true"><svg viewBox="0 0 27 42"><path d="M23 2 3 21l20 19" fill="none" stroke="#363636" stroke-width="3.5"/></svg></div><div class="pos title" data-bind="title"></div>
<section class="card transaction">
<div class="logo" id="logo"><span class="source-icon default-logo" role="img" aria-label="商户图标"></span></div>
<div class="pos merchant" data-bind="merchant"></div><div class="pos amount" data-bind="amount"></div><div class="pos status" data-bind="status"></div>
<div class="line time"><span class="label" data-bind="timeLabel"></span><span class="value" data-bind="time"></span></div>
<div class="line payment"><span class="label" data-bind="paymentLabel"></span><span class="value"><span data-bind="payment"></span><i class="chevron"></i></span></div>
<div class="line description"><span class="label" data-bind="descriptionLabel"></span><span class="value" data-bind="description"></span></div>
<div class="pos shopping"><span data-bind="shopping"></span><i class="chevron"></i></div>
<div class="line reward"><span class="label" data-bind="rewardLabel"></span><span class="value"><span class="coin source-icon" aria-hidden="true"></span><span data-bind="reward"></span></span></div>
<div class="line acquirer"><span class="label" data-bind="acquirerLabel"></span><span class="value" data-bind="acquirer"></span></div>
<div class="pos more"><span data-bind="more"></span><i class="chevron"></i></div>
</section>
<section class="card management">
<div class="pos manage-title" data-bind="manageTitle"></div><div class="pos promo"><span data-bind="promo"></span><span class="gift source-icon" aria-hidden="true"></span><i class="chevron"></i></div>
<div class="pos category-row"><span data-bind="categoryLabel"></span><button class="muted" id="categoryButton"><span data-bind="category"></span><i class="chevron"></i></button></div>
<div class="pos category-prompt" id="categoryPrompt"></div>
<div class="pos actions"><button class="cancel" id="cancelButton" data-bind="cancel"></button><button class="mark" id="markButton" data-bind="mark"></button></div>
<div class="pos tags-row"><span data-bind="tagsLabel"></span><button class="muted" id="tagButton"><span data-bind="tag"></span><i class="chevron"></i></button></div>
<div class="pos recommend"><span data-bind="recommendLabel"></span><button id="recommendButton"><span class="cart source-icon" aria-hidden="true"></span><span data-bind="recommend"></span><span class="plus">＋</span></button></div>
<div class="pos income"><span data-bind="incomeLabel"></span><button id="incomeSwitch" class="switch" role="switch" aria-label="计入收支" aria-checked="true"></button></div>
</section>
<div class="home-area"><div class="home-indicator"></div></div>
</div></div></main></div>
<button class="return-editor" id="returnEditor">返回编辑 · Esc</button><div class="toast" id="toast" role="status"></div>
<script id="saved-state" type="application/json">null</script>
<script>
(()=>{'use strict';
const defaults={title:'账单详情',merchant:'卜蜂莲花(长兴店)',amount:'-10.90',status:'交易成功',time:'2026-10-17 19:49:36',payment:'花呗',description:'卜蜂莲花超市自助收银订单',shopping:'查看购物详情',reward:'立即领取2积分',acquirer:'支付宝支付科技有限公司',category:'其他',tag:'请选择',promo:'已解锁"日用百货"贴纸，去兑换好礼',recommend:'超市采买',timeLabel:'支付时间',paymentLabel:'付款方式',descriptionLabel:'商品说明',rewardLabel:'支付奖励',acquirerLabel:'收单机构',more:'更多',manageTitle:'账单管理',categoryLabel:'账单分类',cancel:'取消',mark:'全部标记',tagsLabel:'标签',recommendLabel:'为您推荐',incomeLabel:'计入收支',income:true,logo:''};
const main=[['merchant','商户名称'],['amount','交易金额（含正负号）'],['status','交易状态'],['time','支付时间'],['payment','付款方式'],['description','商品说明'],['acquirer','收单机构'],['category','账单分类'],['tag','标签']];
const extra=[['title','页面标题'],['shopping','购物详情文字'],['reward','支付奖励内容'],['promo','蓝色活动条文字'],['recommend','推荐标签'],['timeLabel','支付时间标题'],['paymentLabel','付款方式标题'],['descriptionLabel','商品说明标题'],['rewardLabel','支付奖励标题'],['acquirerLabel','收单机构标题'],['more','更多文字'],['manageTitle','账单管理标题'],['categoryLabel','账单分类标题'],['cancel','取消按钮'],['mark','全部标记按钮'],['tagsLabel','标签标题'],['recommendLabel','推荐区域标题'],['incomeLabel','收支开关标题']];
const $=id=>document.getElementById(id);let embedded=null;try{embedded=JSON.parse($('saved-state').textContent)}catch{}let state={...defaults,...embedded};const storageKey='bill-ui-replica-v1';if(!embedded){try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&typeof saved==='object')state={...defaults,...saved}}catch{}}
const defaultLogo=$('logo').innerHTML;const inputs={};let toastTimer;
function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2000)}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}
function render(){document.querySelectorAll('[data-bind]').forEach(el=>el.textContent=String(state[el.dataset.bind]??''));$('categoryPrompt').textContent=`是否将一年内的[${state.merchant}]的账单分类都标记为[${state.category}]`;$('incomeSwitch').setAttribute('aria-checked',String(!!state.income));$('incomeControl').checked=!!state.income;Object.entries(inputs).forEach(([key,input])=>{if(input.value!==String(state[key]))input.value=state[key]});if(state.logo&&/^data:image\//.test(state.logo)){let img=$('logo').querySelector('img');if(!img){img=document.createElement('img');img.alt='商户 Logo';$('logo').replaceChildren(img)}if(img.getAttribute('src')!==state.logo)img.src=state.logo}else if(!$('logo').querySelector('.default-logo'))$('logo').innerHTML=defaultLogo;persist()}
function fields(schema,container){schema.forEach(([key,label])=>{const wrap=document.createElement('label');wrap.className='field';const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='text';input.value=state[key];input.autocomplete='off';input.id='field-'+key;input.addEventListener('input',()=>{state[key]=input.value;render()});wrap.append(name,input);$(container).append(wrap);inputs[key]=input})}
fields(main,'mainFields');fields(extra,'extraFields');
let width=400;function resize(){const pure=document.body.classList.contains('pure');const available=pure?window.innerWidth:document.querySelector('.preview-area').clientWidth;const w=Math.max(1,Math.min(width,available));$('viewport').style.width=w+'px';$('viewport').style.height=w*2048/958+'px';$('phone').style.transform=`scale(${w/958})`;$('widthOutput').textContent=width+' px'}
$('previewWidth').addEventListener('input',e=>{width=Number(e.target.value);resize()});window.addEventListener('resize',resize);function pureMode(value){document.body.classList.toggle('pure',value);resize();window.scrollTo(0,0)}$('pure').onclick=()=>pureMode(true);$('returnEditor').onclick=()=>pureMode(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')pureMode(false)});
$('reset').onclick=()=>{state={...defaults};$('categoryPrompt').hidden=false;document.querySelector('.actions').hidden=false;render();notify('已恢复原图内容')};$('incomeControl').onchange=e=>{state.income=e.target.checked;render()};$('incomeSwitch').onclick=()=>{state.income=!state.income;render()};
function focusField(key){pureMode(false);inputs[key].scrollIntoView({behavior:'smooth',block:'center'});inputs[key].focus()}
$('categoryButton').onclick=()=>focusField('category');$('tagButton').onclick=()=>focusField('tag');$('recommendButton').onclick=()=>{state.tag=state.recommend;render();notify('已添加推荐标签')};$('cancelButton').onclick=()=>{$('categoryPrompt').hidden=true;document.querySelector('.actions').hidden=true};$('markButton').onclick=()=>notify('本地演示：已标记为“'+state.category+'”');
$('logoUpload').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!/^image\//.test(file.type)||file.size>5*1024*1024){notify('请选择 5 MB 以内的图片');return}const reader=new FileReader();reader.onload=()=>{state.logo=reader.result;render()};reader.readAsDataURL(file)};$('resetLogo').onclick=()=>{state.logo='';$('logoUpload').value='';render()};
$('download').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('body').classList.remove('pure');clone.querySelector('#mainFields').replaceChildren();clone.querySelector('#extraFields').replaceChildren();clone.querySelector('#logo').innerHTML=defaultLogo;clone.querySelector('#categoryPrompt').hidden=false;clone.querySelector('.actions').hidden=false;clone.querySelector('#toast').classList.remove('show');const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bill-ui-edited.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已下载包含当前信息的 HTML')};
render();resize();
})();
</script>
