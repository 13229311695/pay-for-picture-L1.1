<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>支付详情界面复刻</title>
<style>
  :root {
    --ink: #171717;
    --muted: #8a8a8f;
    --line: #ececec;
    --section: #f1f1f1;
    --link: #687ea5;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: #f3f3f5;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  button, input, textarea, select { font: inherit; }
  .app {
    min-height: 100vh;
    padding: 24px;
    display: grid;
    grid-template-columns: minmax(360px, 1fr) minmax(300px, 360px);
    gap: 28px;
    align-items: start;
    justify-content: center;
  }
  .preview-stage {
    min-width: 0;
    display: flex;
    justify-content: center;
    position: sticky;
    top: 24px;
  }
  .screen-shell {
    width: min(100%, 955px);
    aspect-ratio: 955 / 2048;
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    background: #fff;
    box-shadow: 0 20px 52px rgba(20, 20, 28, .15), 0 0 0 1px rgba(0,0,0,.06);
  }
  .screen {
    width: 955px;
    height: 2048px;
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: top left;
    overflow: hidden;
    background: #fff;
  }
  .close-mark {
    position: absolute;
    top: 41px;
    left: 31px;
    width: 36px;
    height: 36px;
    color: #252525;
    user-select: none;
  }
  .close-mark::before,
  .close-mark::after {
    content: "";
    position: absolute;
    top: 16px;
    left: -1px;
    width: 44px;
    height: 3px;
    border-radius: 3px;
    background: #2b2b2b;
  }
  .close-mark::before { transform: rotate(45deg); }
  .close-mark::after { transform: rotate(-45deg); }
  .top-rule {
    position: absolute;
    top: 115px;
    left: 0;
    width: 100%;
    height: 1px;
    background: #f3f3f3;
  }
  .hero-logo {
    position: absolute;
    top: 173px;
    left: 422px;
    width: 112px;
    height: 112px;
    object-fit: contain;
    display: block;
  }
  .hero-name {
    position: absolute;
    top: 323px;
    left: 60px;
    width: 835px;
    text-align: center;
    font-size: 43px;
    font-weight: 400;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-amount {
    position: absolute;
    top: 423px;
    left: 44px;
    width: 867px;
    font-size: 87.6px;
    font-weight: 400;
    letter-spacing: -2.5px;
    line-height: 1.2;
    white-space: nowrap;
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
  }
  .hero-amount-sign { display: inline-block; margin-right: 4px; }
  .details {
    position: absolute;
    top: 625px;
    left: 76px;
    width: 803px;
    border-top: 1px solid var(--line);
    padding-top: 58px;
  }
  .detail-row {
    display: grid;
    grid-template-columns: 208px minmax(0, 1fr);
    column-gap: 0;
    align-items: start;
    margin-bottom: 16px;
  }
  .detail-label {
    color: var(--muted);
    font-size: 35px;
    line-height: 1.42;
    font-weight: 400;
    white-space: nowrap;
  }
  .detail-value {
    color: #222225;
    font-size: 35px;
    line-height: 1.42;
    font-weight: 400;
    overflow-wrap: anywhere;
  }
  .detail-row.product { margin-top: -2px; margin-bottom: 23px; }
  .detail-row.product .detail-value { line-height: 1.42; }
  .section-gap {
    position: absolute;
    left: 0;
    width: 100%;
    height: 20px;
    background: var(--section);
  }
  .gap-one { top: 1372px; }
  .gap-two { top: 1562px; }
  .miniapp {
    position: absolute;
    top: 1392px;
    left: 0;
    width: 100%;
    height: 170px;
    padding: 0 76px;
    display: grid;
    grid-template-columns: 190px 1fr 24px;
    column-gap: 16px;
    align-items: center;
    background: #fff;
  }
  .miniapp-title {
    width: auto;
    height: 48px;
    font-size: 34px;
    line-height: 48px;
    font-weight: 400;
    white-space: nowrap;
  }
  .miniapp-copy {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 48px;
    min-width: 0;
    color: #929296;
    font-size: 32px;
    line-height: 48px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  #miniappValue {
    min-width: 0;
    overflow: hidden;
    text-align: right;
  }
  .music-note {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    margin-right: 12px;
    color: #6d73e9;
    display: block;
  }
  .chevron {
    width: 24px;
    height: 36px;
    display: block;
    overflow: visible;
  }
  .chevron path {
    fill: none;
    stroke: #b7b7b9;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .music-note path {
    fill: none;
    stroke: currentColor;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .services {
    position: absolute;
    top: 1582px;
    left: 0;
    width: 100%;
    height: 363px;
    padding: 44px 76px 0;
    background: #fff;
  }
  .services-title {
    font-size: 36px;
    line-height: 1.2;
    font-weight: 400;
  }
  .services-rule {
    width: 100%;
    height: 1px;
    margin-top: 39px;
    background: #e7e7e7;
  }
  .services-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 62px;
    row-gap: 48px;
    margin-top: 43px;
  }
  .service-link {
    min-width: 0;
    display: flex;
    align-items: center;
    color: var(--link);
    font-size: 34px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .service-link svg {
    width: 36px;
    height: 36px;
    margin-right: 18px;
    flex: 0 0 36px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .bottom-gap {
    position: absolute;
    top: 1945px;
    left: 0;
    width: 100%;
    height: 20px;
    background: var(--section);
  }
  .home-area {
    position: absolute;
    top: 1965px;
    left: 0;
    width: 100%;
    height: 83px;
    background: #fff;
  }
  .home-indicator {
    position: absolute;
    left: 380px;
    top: 49px;
    width: 195px;
    height: 8px;
    border-radius: 10px;
    background: #7d7d7d;
  }
  .editor {
    width: 100%;
    max-height: calc(100vh - 48px);
    overflow: auto;
    padding: 20px;
    border: 1px solid #e9e9ec;
    border-radius: 20px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 16px 36px rgba(20, 20, 28, .08);
    backdrop-filter: blur(14px);
  }
  .editor h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  .editor p { margin: 8px 0 18px; color: #777780; font-size: 13px; line-height: 1.55; }
  .editor-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid #ededf0; }
  .editor-section:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .editor-section h2 { margin: 0 0 10px; font-size: 14px; color: #414149; }
  .field { display: grid; gap: 6px; margin: 10px 0; }
  .field span { color: #62626b; font-size: 12px; }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid #dedee4;
    border-radius: 10px;
    background: #fff;
    color: #222227;
    padding: 9px 10px;
    outline: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #7588b4; box-shadow: 0 0 0 3px rgba(117,136,180,.14); }
  .logo-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .logo-option { position: relative; display: grid; gap: 5px; justify-items: center; padding: 8px 4px 7px; border: 1px solid #e3e3e8; border-radius: 12px; cursor: pointer; background: #fff; }
  .logo-option:has(input:checked) { border-color: #6f82ae; box-shadow: 0 0 0 2px rgba(111,130,174,.13); }
  .logo-option input { position: absolute; opacity: 0; pointer-events: none; }
  .logo-option img { width: 44px; height: 44px; object-fit: contain; }
  .logo-option b { font-size: 11px; font-weight: 500; color: #55555c; }
  .reset { width: 100%; margin-top: 10px; padding: 10px 12px; border: 0; border-radius: 11px; background: #1e1e22; color: #fff; cursor: pointer; }
  .tip { margin-top: 10px; color: #9a9aa1; font-size: 11px; line-height: 1.45; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; padding: 14px; gap: 16px; }
    .preview-stage { position: static; order: 1; }
    .editor { order: 2; max-height: none; }
    .screen-shell { width: min(100%, 520px); }
  }
</style>
</head>
<body>
<div class="app">
  <main class="preview-stage" aria-label="支付详情预览">
    <div class="screen-shell" id="screenShell">
      <div class="screen" id="screen">
        <div class="close-mark" aria-hidden="true"></div>
        <div class="top-rule"></div>
        <img class="hero-logo" id="heroLogo" alt="当前 Logo" />
        <div class="hero-name" id="heroName"></div>
        <div class="hero-amount" id="heroAmount"><span class="hero-amount-sign" id="heroAmountSign"></span><span id="heroAmountNumber"></span></div>

        <section class="details" aria-label="支付明细">
          <div class="detail-row"><div class="detail-label">当前状态</div><div class="detail-value" id="statusValue"></div></div>
          <div class="detail-row"><div class="detail-label">支付时间</div><div class="detail-value" id="timeValue"></div></div>
          <div class="detail-row product"><div class="detail-label">商品</div><div class="detail-value" id="productValue"></div></div>
          <div class="detail-row"><div class="detail-label">收单机构</div><div class="detail-value" id="orgValue"></div></div>
          <div class="detail-row"><div class="detail-label">支付方式</div><div class="detail-value" id="methodValue"></div></div>
          <div class="detail-row"><div class="detail-label">交易单号</div><div class="detail-value" id="transactionValue"></div></div>
          <div class="detail-row"><div class="detail-label">商户单号</div><div class="detail-value" id="merchantIdValue"></div></div>
        </section>

        <div class="section-gap gap-one"></div>
        <section class="miniapp" aria-label="商家小程序">
          <div class="miniapp-title">商家小程序</div>
          <div class="miniapp-copy"><svg class="music-note" viewBox="0 0 42 42" aria-hidden="true"><path d="M14 25.5 23.5 16a6.1 6.1 0 0 1 8.6 8.6l-4.1 4.1a6.1 6.1 0 0 1-8.6 0"></path><path d="m28 16.5-9.5 9.5a6.1 6.1 0 0 1-8.6-8.6l4.1-4.1a6.1 6.1 0 0 1 8.6 0"></path></svg><span id="miniappValue"></span></div>
          <svg class="chevron" viewBox="0 0 24 36" aria-hidden="true"><path d="M5 4 18 18 5 32"></path></svg>
        </section>
        <div class="section-gap gap-two"></div>

        <section class="services" aria-label="账单服务">
          <div class="services-title">账单服务</div>
          <div class="services-rule"></div>
          <div class="services-grid">
            <div class="service-link"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19"></circle><path d="M19.5 18.5c.7-3.1 3.1-5.1 6.5-5.1 3.7 0 6.4 2.2 6.4 5.5 0 3.1-2 4.7-4.7 6.2-2.3 1.2-3.2 2.2-3.2 4.5"></path><circle cx="24.5" cy="35.8" r="1.2" fill="currentColor" stroke="none"></circle></svg><span>对订单有疑惑</span></div>
            <div class="service-link"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 9h21v30H14z"></path><path d="M19 16h11M19 22h11M19 30h7"></path><path d="m29 31 3 3 6-7"></path></svg><span>发起群收款</span></div>
            <div class="service-link"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 9h21v30H14z"></path><path d="M19 16h11M19 22h11M19 28h8M19 34h8"></path></svg><span>在此商户的交易</span></div>
            <div class="service-link"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19"></circle><path d="m24 13 3.3 6.8 7.5 1.1-5.4 5.3 1.3 7.5-6.7-3.6-6.7 3.6 1.3-7.5-5.4-5.3 7.5-1.1z"></path></svg><span>申请电子凭证</span></div>
          </div>
        </section>
        <div class="bottom-gap"></div>
        <div class="home-area"><div class="home-indicator"></div></div>
      </div>
    </div>
  </main>

  <aside class="editor" aria-label="界面数据编辑">
    <h1>编辑界面数据</h1>
    <p>输入内容会实时同步到左侧手机界面。Logo 选项使用上传 PNG 的文件名。</p>
    <section class="editor-section">
      <h2>Logo 选择</h2>
      <div class="logo-options">
        <label class="logo-option"><input type="radio" name="logo" value="01" checked><img data-logo="01" alt="01"><b>01.png</b></label>
        <label class="logo-option"><input type="radio" name="logo" value="02"><img data-logo="02" alt="02"><b>02.png</b></label>
        <label class="logo-option"><input type="radio" name="logo" value="03"><img data-logo="03" alt="03"><b>03.png</b></label>
        <label class="logo-option"><input type="radio" name="logo" value="04"><img data-logo="04" alt="04"><b>04.png</b></label>
      </div>
    </section>
    <section class="editor-section">
      <h2>顶部信息</h2>
      <label class="field"><span>商户名称</span><input data-key="merchantName" autocomplete="off"></label>
      <label class="field"><span>金额</span><input data-key="amount" inputmode="decimal" autocomplete="off"></label>
    </section>
    <section class="editor-section">
      <h2>支付明细</h2>
      <label class="field"><span>当前状态</span><input data-key="status" autocomplete="off"></label>
      <label class="field"><span>支付时间</span><input data-key="time" autocomplete="off"></label>
      <label class="field"><span>商品</span><textarea data-key="product"></textarea></label>
      <label class="field"><span>收单机构</span><input data-key="org" autocomplete="off"></label>
      <label class="field"><span>支付方式</span><input data-key="method" autocomplete="off"></label>
      <label class="field"><span>交易单号</span><input data-key="transaction" autocomplete="off"></label>
      <label class="field"><span>商户单号</span><input data-key="merchantId" autocomplete="off"></label>
    </section>
    <section class="editor-section">
      <h2>商家小程序</h2>
      <label class="field"><span>小程序名称</span><textarea data-key="miniapp"></textarea></label>
    </section>
    <button class="reset" id="resetButton" type="button">恢复原图默认内容</button>
    <div class="tip">字体优先使用 iOS 系统字体（SF Pro / PingFang SC），其他环境会自动回退到相近的系统字体。</div>
  </aside>
</div>
